<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vrProject01 AR</title>
<meta name="description" content="Model v rozšířené realitě: položte ho na stůl v měřítku 1:50 až 1:5000.">
<style>
:root { --ink: #1B2330; --ink-2: #4A5566; --panel: rgba(255,255,255,.94); --line: #DCE1E8; --accent: #1F5FD1; --bg: #E9EDF2; }
@media (prefers-color-scheme: dark) { :root { --ink: #E6EAF0; --ink-2: #AAB4C2; --panel: rgba(23,30,40,.92); --line: #2A3442; --accent: #5B92FF; --bg: #11161E; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.bar { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; display: grid; gap: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
h1 { margin: 0 auto 0 0; font-size: 17px; font-weight: 700; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; max-width: 100%; }
.seg button { flex: none; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 14px/1 system-ui, sans-serif; padding: 10px 9px; min-height: 40px; font-variant-numeric: tabular-nums; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; font: 700 15px/1 system-ui, sans-serif; border-radius: 8px; padding: 12px 16px; min-height: 44px; }
model-viewer { width: 100%; height: 100%; background: var(--bg); --poster-color: transparent; }
.foot { padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
.foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
#msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; z-index: 20; }
#msg p { margin: 0 0 12px; }
.progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); transform-origin: left; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="row"><h1>vrProject01 · AR</h1><button class="btn" id="ar" type="button">Spustit AR</button></div>
    <div class="row">
      <div class="seg" id="scales" role="group" aria-label="Měřítko modelu"></div>
      <div class="seg" id="content" role="group" aria-label="Obsah modelu">
        <button type="button" data-v="all" aria-pressed="true">Celý model</button><button type="button" data-v="s" aria-pressed="false">Jen konstrukce</button>
      </div>
    </div>
  </div>
  <model-viewer id="mv" src="model_2000.glb" alt="3D model" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls touch-action="pan-y" interaction-prompt="none" shadow-intensity="0.7" exposure="1.05" camera-orbit="-35deg 55deg auto">
    <button slot="ar-button" hidden></button>
    <div class="progress" slot="progress-bar" id="progress"></div>
  </model-viewer>
  <div class="foot">
    <div id="size"></div>
    <div>V AR namiřte telefon na stůl, klepněte na místo (střed kříže na listu A4) a model se na něm zamkne. Otočíte ho dvěma prsty, měřítko zůstává pevné.</div>
  </div>
</div>
<div id="msg" hidden><p id="msg-text"></p><button class="btn" id="msg-ok" type="button">OK</button></div>
<script type="module">
// Native AR through model-viewer: iPhone AR Quick Look (USDZ generated on the fly), Android WebXR / Scene Viewer.
// One GLB per scale (model_<S>.glb whole model, model_<S>_s.glb structure only); ar-scale="fixed" locks the scale.
const SCALES = [50, 100, 200, 500, 1000, 2000, 5000];
const AREA = [604, 584], STRUCT = 300;              // model extent in metres (whole model / structure length)
const mv = document.getElementById("mv"), sizeEl = document.getElementById("size");
let scale = 2000, content = "all";
const fmt = m => m >= 1 ? m.toFixed(2).replace(".", ",") + " m" : (m * 100).toFixed(m >= 0.1 ? 0 : 1).replace(".", ",") + " cm";
function update() {
  mv.src = `model_${scale}${content === "s" ? "_s" : ""}.glb`;
  document.querySelectorAll("#scales button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.s === scale)));
  document.querySelectorAll("#content button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === content)));
  sizeEl.innerHTML = content === "s" ? `1:${scale} · konstrukce v AR <b>${fmt(STRUCT / scale)}</b> dlouhá`
                                     : `1:${scale} · model v AR <b>${fmt(AREA[0] / scale)} × ${fmt(AREA[1] / scale)}</b>`;
}
const seg = document.getElementById("scales");
SCALES.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.dataset.s = s; b.textContent = "1:" + s;
  b.addEventListener("click", () => { scale = s; update(); }); seg.append(b); });
document.querySelectorAll("#content button").forEach(b => b.addEventListener("click", () => { content = b.dataset.v; update(); }));
update();

const progress = document.getElementById("progress");
mv.addEventListener("progress", e => { progress.style.transform = `scaleX(${e.detail.totalProgress})`; progress.hidden = e.detail.totalProgress >= 1; });
const msg = t => { document.getElementById("msg-text").textContent = t; document.getElementById("msg").hidden = false; };
document.getElementById("msg-ok").addEventListener("click", () => document.getElementById("msg").hidden = true);
mv.addEventListener("error", () => msg("Model se nepodařilo načíst. Zkontrolujte připojení a zkuste to znovu."));
mv.addEventListener("ar-status", e => { if (e.detail.status === "failed") msg("AR se nepodařilo spustit. Zkuste to znovu, nebo otevřete stránku v Safari (iPhone) či Chrome (Android)."); });
document.getElementById("ar").addEventListener("click", async () => {
  await customElements.whenDefined("model-viewer");
  if (!mv.loaded) await new Promise(r => mv.addEventListener("load", r, { once: true }));
  if (mv.canActivateAR) mv.activateAR();
  else msg("Tento prohlížeč neumí AR. Na iPhonu použijte Safari nebo Chrome, na Androidu Chrome s podporou ARCore. Na počítači zůstává 3D náhled.");
});
</script>
</body>
</html>
